<title>Оффлайн-плеер</title>
<style>
:root{--ink:#f2f2f4;--mute:#85858c;--line:rgba(255,255,255,.08);--panel:rgba(255,255,255,.06);--acc:#e9e9ee;--bg1:#eceef6;--bg2:#c9cde0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;font-family:Roboto,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink)}
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:32px;padding:20px}
.phone{position:relative;width:380px;height:min(760px,calc(100dvh - 40px));border-radius:44px;overflow:hidden;background:linear-gradient(180deg,#15161a,#2b2b2e);box-shadow:0 30px 60px -20px rgba(30,30,60,.55);display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fill{fill:currentColor;stroke:none}
/* library */
.head{padding:34px 24px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font-size:32px;line-height:1.08;font-weight:500}
.sub{margin-top:8px;color:#c9c9ce;font-size:14px}.sub span{color:var(--mute)}
.round{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e4e4e7,#8d8d92);color:#2a2a2d;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.45);flex:none}
.tools{display:flex;gap:8px;padding:14px 24px 6px;align-items:center}
.search{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:10px 14px;font:inherit;font-size:14px;outline:0;min-width:0}
.chip{padding:9px 14px;border-radius:14px;background:var(--panel);font-size:13px;color:var(--mute);border:1px solid var(--line)}
.chip.on{color:#1d1d20;background:var(--acc)}
.add{width:40px;height:40px;border-radius:14px;background:var(--acc);color:#1d1d20;display:grid;place-items:center;flex:none}
.list{flex:1;overflow-y:auto;padding:6px 18px 12px;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:14px;cursor:pointer}
.row.cur{background:var(--panel)}
.num{width:26px;height:26px;border-radius:50%;border:1px solid #777;display:grid;place-items:center;font-size:12px;color:#bbb;flex:none}
.row.cur .num{background:var(--acc);color:#1d1d20;border-color:var(--acc)}
.meta{flex:1;min-width:0}
.t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:13px;color:#5f5f66;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row.cur .a{color:var(--mute)}
.ib{color:#5f5f66;padding:4px}.ib.on{color:var(--ink)}
.del{background:#c4453f;color:#fff;border-radius:10px;padding:6px 10px;font-size:12px}
.empty{margin:30px 6px;padding:34px 20px;border:1.5px dashed #55555c;border-radius:22px;text-align:center;color:var(--mute);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:500;margin-bottom:8px}
.empty button{margin-top:16px;background:var(--acc);color:#1d1d20;padding:11px 20px;border-radius:14px;font-size:14px}
.mini{margin:0 14px 16px;padding:10px 14px 10px 10px;border-radius:22px;background:rgba(255,255,255,.1);backdrop-filter:blur(14px);display:flex;align-items:center;gap:12px;cursor:pointer}
.mini .cv{width:44px;height:44px;border-radius:12px;flex:none}
.mini[hidden]{display:none}
.drop{position:absolute;inset:0;background:rgba(20,20,24,.85);display:none;place-items:center;font-size:18px;z-index:9}
.drag .drop{display:grid}
/* player */
.cover{position:relative;flex:none;height:56%;display:grid;place-items:center;overflow:hidden}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,#1c1c1f)}
.cover .big{font-size:130px;font-weight:700;opacity:.22;letter-spacing:-4px}
.topbar{position:absolute;top:34px;left:20px;right:20px;display:flex;justify-content:space-between;z-index:2}
.glass{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);display:grid;place-items:center}
.sheet{position:relative;z-index:1;flex:1;margin-top:-34px;border-radius:34px 34px 0 0;background:linear-gradient(180deg,#232326,#38383b);padding:12px 24px 22px;display:flex;flex-direction:column}
.handle{width:56px;height:4px;border-radius:2px;background:#555;margin:0 auto 18px}
.album{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.title h2{margin:0;font-size:28px;font-weight:600;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artist{margin-top:6px;font-size:16px;color:#d0d0d4}
.wave{margin-top:auto;height:70px;display:flex;align-items:center;gap:3px;cursor:pointer}
.wave i{flex:1;border-radius:2px;background:#5a5a60;min-height:3px}
.wave i.on{background:var(--ink)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin:6px 0 10px;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between}
.ctl .ib{color:#b3b3b9;padding:8px}.ctl .ib.on{color:#fff}
.ctl .round{width:68px;height:68px}
.one{position:relative}
.one::after{content:"1";position:absolute;right:2px;top:2px;font-size:10px;font-weight:700}
@media(max-width:900px){
 .stage{padding:0;gap:0}

 .stage[data-view=lib] #player,.stage[data-view=player] #lib{display:none}

}

.title h2{flex:1;min-width:0}
.mq{display:inline-flex;animation:mq linear infinite;will-change:transform}.mq span{padding-right:56px}

button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sheet{overflow:hidden}
.sheet>*{flex-shrink:0}
.handle{position:relative;cursor:grab}
.handle::before{content:"";position:absolute;inset:-16px -48px}
.handle,.extra{touch-action:none}
.extra{overflow:hidden}
.sheet.col .opt{display:none}
.sheet.col .ctl{justify-content:center;gap:36px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);max-width:min(90vw,420px);padding:12px 18px;border-radius:18px;background:rgba(20,20,30,.78);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.25);font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:20}

.cartw{position:absolute;inset:72px 24px 58px;container-type:size;display:grid;place-items:center;pointer-events:none}

<body>
<main class="stage" data-view="lib" id="stage">
<input type="file" id="file" accept="audio/*,.mp3,.m4a,.m4b,.mp4,.aac,.wav,.wave,.aif,.aiff,.aifc,.flac,.alac,.caf,.ape,.wma,.wv,.ogg,.oga,.opus,.spx,.dsf,.dff,.mid,.midi,.kar,.amr,.awb,.mqa,.mka,.webm,.3gp,.ac3,.mpc" multiple hidden>
<input type="file" id="img" accept="image/*" hidden>
<input type="file" id="cimg" accept="image/*" hidden>

<section class="phone" id="lib">
 <div class="drop">Отпустите, чтобы добавить музыку</div>
 <div class="head">
  <div><h1>Моя музыка</h1><div class="sub" id="count"></div></div>
  <button class="round" id="playAll" aria-label="Играть все"></button>
 </div>
 <div class="tools">
  <input class="search" id="q" placeholder="Поиск по трекам и исполнителям">
  <button class="chip on" id="fAll">Все</button>
  <button class="chip" id="fFav">Избр.</button>
  <button class="add" id="addBtn" aria-label="Добавить музыку"></button>
 </div>
 <div class="list" id="list"></div>
 
 <div class="mini" id="mini" hidden>
  <div class="cv" id="miniCv"></div>
  <div class="meta"><div class="t" id="miniT"></div><div class="a" id="miniA"></div></div>
  <button class="ib on" id="miniPlay" aria-label="Пауза"></button>
 </div>
</section>

<section class="phone" id="player">
 <div class="cbg" id="cbg"></div>
 <div class="cover" id="cover"><div class="cartw"><img class="cart" id="cart" alt="" hidden></div><div class="big" id="big">♪</div>
  <div class="topbar"><button class="glass" id="back" aria-label="Библиотека" title="Библиотека"></button><div style="display:flex;gap:8px"><button class="glass" id="cvBtn" aria-label="Картинка трека" title="Картинка трека"></button><button class="glass" id="bg" aria-label="Свой фон"></button><button class="glass" id="bgReset" aria-label="Сбросить фон"></button></div></div>
 </div>
 <div class="sheet">
  <div class="handle"></div>
  <div class="extra" id="extra">
  <div class="album" id="pAlbum">Локальная библиотека</div>
  <div class="title"><h2 id="pTitle">Выберите трек</h2><button class="ib" id="fav" aria-label="В избранное"></button></div>
  <div class="artist" id="pArtist">Добавьте музыку из файлов</div>
  <div class="wave" id="wave"></div>
  <div class="times"><span id="tc">0:00</span><span id="td">0:00</span></div></div>
  <div class="vol"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 10v4h4l5 4V6L8 10z"/></svg><input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="Громкость"><svg class="ic" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 10v4h4l5 4V6L8 10zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></div>
  <div class="ctl">
   <button class="ib opt" id="shuf" aria-label="Перемешать"></button>
   <button class="ib" id="prev" aria-label="Назад"></button>
   <button class="round" id="pp" aria-label="Играть"></button>
   <button class="ib" id="next" aria-label="Вперёд"></button>
   <button class="ib opt" id="rep" aria-label="Повтор"></button></div><div hidden>
  </div>
 </div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

  try{const g=await readTags(f);if(g.title)t.title=g.title;if(g.artist)t.artist=g.artist;if(g.art)t.art=await thumb(g.art)}catch(e){console.error('Tags:',e)}
  if(MIDI.test(f.name)){try{const r=await midiToBlob(await f.arrayBuffer());t.play=r.blob;t.dur=r.dur}catch(e){console.error('MIDI:',e);toast('Не удалось прочитать MIDI «'+f.name+'»');continue}}
  tracks.push(t);put(t);render();
 }
}
/* playback */
function play(i){
 if(i<0||i>=tracks.length)return;
 cur=i;const t=tracks[i];
 if(waMode){au.pause();drawPlayer();drawList();waPlay(t);return}
 if(!urls[t.id])urls[t.id]=URL.createObjectURL(srcBlob(t));
 au.src=urls[t.id];au.play().catch(playErr);
 drawPlayer();render();
}
function step(d){
 if(!tracks.length)return;
 if(shuffle&&tracks.length>1){let n;do{n=Math.floor(Math.random()*tracks.length)}while(n===cur);return play(n)}
 play((cur+d+tracks.length)%tracks.length);
}
function toggle(){if(cur<0){play(0);return}if(au.error){play(cur);return}au.paused?au.play().catch(()=>{}):au.pause()}
au.onended=()=>{if(rep===REP.ONE){au.currentTime=0;au.play().catch(()=>{})}else if(rep===REP.OFF&&cur===tracks.length-1&&!shuffle){drawCtl()}else step(1)};
au.onplay=au.onpause=()=>drawCtl();
au.onloadedmetadata=()=>{if(/^data:/.test(au.getAttribute('src')||''))useData=true};
au.onerror=()=>{const src=au.getAttribute('src');if(!src)return;const c=au.error?au.error.code:0;const t=tracks[cur];
 if(t&&c>=3){
  if(/^blob:/.test(src)&&!tried.has(t.id)){tried.add(t.id);waPlay(t);return}
  if(!t.play&&!MIDI.test((t.blob&&t.blob.name)||'')&&!conv.has(t.id)){conv.add(t.id);transcode(t);return}
 }console.error('Audio error: code',c,au.error&&au.error.message);au.pause();toast(c===4?'Формат не поддерживается этим устройством':c===3?'Файл повреждён или не декодируется':'Не удалось воспроизвести файл');drawCtl()};
au.ontimeupdate=()=>{
 const d=au.duration||tracks[cur]?.dur||0,r=d?au.currentTime/d:0;
 $('#tc').textContent=fmt(au.currentTime);$('#td').textContent=fmt(d);
 const b=$('#wave').children,k=Math.round(r*b.length);
 for(let i=0;i<b.length;i++)b[i].classList.toggle('on',i<k);
};
/* render */
function drawCtl(){
 const pl=!au.paused&&!au.error&&cur>=0;
 $('#pp').innerHTML=pl?I.pause:I.play;
 $('#miniPlay').innerHTML=pl?I.pause:I.play;
 $('#playAll').innerHTML=pl?I.pause:I.play;
 $('#shuf').classList.toggle('on',shuffle);
 $('#rep').classList.toggle('on',rep!==REP.OFF);$('#rep').classList.toggle('one',rep===REP.ONE);
}
function drawPlayer(){
 const t=tracks[cur];
 if(!t){$('#pTitle').textContent='Выберите трек';$('#pArtist').textContent='Добавьте музыку из файлов';$('#cover').style.background='transparent';$('#cart').hidden=true;$('#cbg').style.backgroundImage='linear-gradient(135deg,#3a3d4a,#15161a)';$('#cbg').classList.add('on');$('#big').style.display='';return}
 setTitle(t.title);$('#pArtist').textContent=t.artist;
 $('#pAlbum').textContent='Локальная библиотека · офлайн';
 const cv=$('#cover'),im=t.cover||t.art,ci=$('#cart'),cb=$('#cbg');cv.style.background='transparent';
 if(im){ci.onload=()=>{ci.style.setProperty('--ar',ci.naturalWidth/ci.naturalHeight||1);ci.hidden=false};ci.src=im;cb.style.backgroundImage='url("'+im+'")';cb.classList.add('on');$('#big').style.display='none'}
 else{ci.hidden=true;ci.removeAttribute('src');cb.style.backgroundImage=grad(t);cb.classList.add('on');$('#big').style.display='';$('#big').textContent=(t.title[0]||'♪').toUpperCase()}
 $('#fav').innerHTML=I.heart;$('#fav').classList.toggle('on',t.fav);
 $('#fav').firstChild.style.fill=t.fav?'currentColor':'none';
 let s=hs(t.id)%9973;const w=$('#wave');w.innerHTML='';
 for(let i=0;i<52;i++){s=(s*9301+49297)%233280;const e=Math.abs(Math.sin(i/4))*.5+.15;const h=Math.min(1,e+s/233280*.5);const b=document.createElement('i');b.style.height=(8+h*92)+'%';w.appendChild(b)}
 $('#td').textContent=fmt(t.dur);
 const m=$('#mini');m.hidden=false;$('#miniCv').style.background=grad(t);$('#miniT').textContent=t.title;$('#miniA').textContent=t.artist;
 drawCtl();
}
function render(){
 const L=$('#list');
 const n=tracks.length;
 $('#count').innerHTML=`${n} ${n%10===1&&n%100!==11?'трек':(n%10>1&&n%10<5&&(n%100<10||n%100>20))?'трека':'треков'} <span>· работает офлайн</span>`;
 if(!n){L.innerHTML='<div class="empty"><b>Здесь пока пусто</b>Загрузите скачанные треки с устройства — они сохранятся в браузере и будут играть без интернета.<br><button id="emptyAdd">Добавить музыку</button></div>';$('#emptyAdd').onclick=()=>$('#file').click();return}
 const onlyFav=$('#fFav').classList.contains('on');
 const rows=tracks.map((t,i)=>({t,i})).filter(({t})=>(!onlyFav||t.fav)&&(t.title+' '+t.artist).toLowerCase().includes(q));
 L.innerHTML=rows.length?rows.map(({t,i},k)=>`<div class="row${i===cur?' cur':''}" data-i="${i}">
  <div class="num">${k+1}</div>
  <div class="meta"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist)} · ${fmt(t.dur)}</div></div>
  <button class="ib${t.fav?' on':''}" data-f="${i}" aria-label="Избранное">${I.mark.replace('<svg class="ic"','<svg class="ic" style="fill:'+(t.fav?'currentColor':'none')+'"')}</button>
  ${confirmDel===i?`<button class="del" data-y="${i}">Да, удалить</button><button class="ib" data-n="${i}">Отмена</button>`:openMenu===i?`<button class="del" data-d="${i}">Удалить</button>`:`<button class="ib" data-m="${i}" aria-label="Ещё">${I.more}</button>`}
 </div>`).join(''):'<div class="empty">Ничего не найдено</div>';
}
/* events */
$('#list').onclick=e=>{
 const f=e.target.closest('[data-f]'),m=e.target.closest('[data-m]'),d=e.target.closest('[data-d]'),y=e.target.closest('[data-y]'),n=e.target.closest('[data-n]'),r=e.target.closest('.row');
 if(f){const t=tracks[+f.dataset.f];t.fav=!t.fav;put(t);render();if(+f.dataset.f===cur)drawPlayer();return}
 if(m){openMenu=+m.dataset.m;render();return}
 if(n){confirmDel=null;openMenu=null;render();return}
 if(d){confirmDel=+d.dataset.d;openMenu=null;render();return}
 if(y){const i=+y.dataset.y,t=tracks[i];confirmDel=null;rm(t.id);URL.revokeObjectURL(urls[t.id]);delete urls[t.id];
  if(i===cur){au.pause();au.removeAttribute('src');cur=-1;$('#mini').hidden=true;drawPlayer()}else if(i<cur)cur--;
  tracks.splice(i,1);openMenu=null;render();drawCtl();return}
 if(r){openMenu=null;confirmDel=null;play(+r.dataset.i);$('#stage').dataset.view='player'}
};
$('#file').onchange=e=>{add([...e.target.files]);e.target.value=''};
$('#addBtn').onclick=()=>$('#file').click();
$('#q').oninput=e=>{q=e.target.value.toLowerCase();render()};
$('#fAll').onclick=()=>{$('#fAll').classList.add('on');$('#fFav').classList.remove('on');render()};
$('#fFav').onclick=()=>{$('#fFav').classList.add('on');$('#fAll').classList.remove('on');render()};
$('#playAll').onclick=toggle;
$('#pp').onclick=toggle;$('#miniPlay').onclick=e=>{e.stopPropagation();toggle()};
$('#prev').onclick=()=>{au.currentTime>3?au.currentTime=0:step(-1)};
$('#next').onclick=()=>step(1);
$('#shuf').onclick=()=>{shuffle=!shuffle;drawCtl()};
$('#rep').onclick=()=>{rep=(rep+1)%3;drawCtl()};
$('#fav').onclick=()=>{const t=tracks[cur];if(!t)return;t.fav=!t.fav;put(t);drawPlayer();render()};
$('#mini').onclick=()=>{$('#stage').dataset.view='player'};
$('#back').onclick=()=>{$('#stage').dataset.view='lib'};
$('#wave').onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),d=au.duration;if(d)au.currentTime=d*(e.clientX-r.left)/r.width};
['dragenter','dragover'].forEach(n=>addEventListener(n,e=>{e.preventDefault();$('#lib').classList.add('drag')}));
['dragleave','drop'].forEach(n=>addEventListener(n,e=>{e.preventDefault();$('#lib').classList.remove('drag');if(n==='drop')add([...e.dataTransfer.files])}));
$('#back').innerHTML=I.lib;$('#cvBtn').innerHTML=I.img;$('#bg').innerHTML=I.wall;$('#bgReset').innerHTML=I.rst;$('#addBtn').innerHTML=I.plus;
$('#prev').innerHTML=I.prev;$('#next').innerHTML=I.next;$('#shuf').innerHTML=I.shuf;$('#rep').innerHTML=I.rep;$('#fav').innerHTML=I.heart;
try{const v=localStorage.getItem('vol');if(v!==null){au.volume=+v;$('#vol').value=v}}catch(e){}
$('#vol').oninput=e=>{au.volume=+e.target.value;try{localStorage.setItem('vol',e.target.value)}catch(_){}};
let asp=400/760;
const gr=(id,c)=>`<radialGradient id='${id}'><stop offset='0' stop-color='${c}'/><stop offset='1' stop-color='${c}' stop-opacity='0'/></radialGradient>`;
const bl=(id,x,y,r)=>[-400,0,400].map(o=>`<circle cx='${x+o}' cy='${y}' r='${r}' fill='url(#${id})'/>`).join('');
const defWall='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 760'><defs>${gr('a','#ff6fb5')}${gr('b','#4f86ff')}${gr('c','#2fd8b0')}</defs><rect width='400' height='760' fill='#171830'/>${bl('a',80,140,300)}${bl('b',330,330,320)}${bl('c',160,650,340)}</svg>`);
function layout(){const tw=Math.round(innerHeight*asp);const s=document.documentElement.style;s.setProperty('--tw',tw+'px');s.setProperty('--dur',Math.max(25,tw/22)+'s')}
function setWall(url,a){asp=a;document.documentElement.style.setProperty('--wall','url("'+url+'")');layout()}
function resetWall(){setWall(defWall,400/760);document.documentElement.classList.remove('cw')}
function useImage(d){setWall(d,1);document.documentElement.classList.add('cw')}
document.querySelectorAll('.phone').forEach(p=>{const w=document.createElement('div');w.className='wall';p.prepend(w)});
addEventListener('resize',layout);
resetWall();try{const w=localStorage.getItem('wall');if(w)useImage(w)}catch(e){}
$('#bg').onclick=()=>$('#img').click();
$('#bgReset').onclick=()=>{const t=tracks[cur];if(t&&t.cover){delete t.cover;put(t);drawPlayer()}resetWall();try{localStorage.removeItem('wall')}catch(e){}};
$('#img').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onerror=()=>toast('Не удалось открыть картинку');im.onload=()=>{const s=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(u);useImage(d);try{localStorage.setItem('wall',d);toast('Фон сохранён')}catch(err){console.error('Wallpaper save:',err);toast('Фон применён, но после перезапуска пропадёт: файл слишком большой')}};im.src=u};
function setTitle(s){const h=$('#pTitle');h.textContent=s;requestAnimationFrame(()=>{if(h.scrollWidth>h.clientWidth+1){const w=h.scrollWidth;h.innerHTML='<span class="mq" style="animation-duration:'+Math.max(6,w/45)+'s"><span>'+esc(s)+'</span><span>'+esc(s)+'</span></span>'}})}
new MutationObserver(()=>{const t=tracks[cur];if(t)setTitle(t.title)}).observe($('#stage'),{attributes:true,attributeFilter:['data-view']});
addEventListener('resize',()=>{const t=tracks[cur];if(t)setTitle(t.title)});
$('#cvBtn').onclick=()=>{if(cur>=0)$('#cimg').click()};
$('#cimg').onchange=e=>{const f=e.target.files[0];e.target.value='';const t=tracks[cur];if(!f||!t)return;const u=URL.createObjectURL(f),im=new Image();im.onerror=()=>toast('Не удалось открыть картинку');im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);t.cover=c.toDataURL('image/jpeg',.85);URL.revokeObjectURL(u);put(t);drawPlayer()};im.src=u};
addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const tg=e.target,tag=tg.tagName;
 if((tag==='INPUT'&&tg.type!=='range')||tag==='TEXTAREA')return;
 if(e.code==='Space'){if(tag==='BUTTON')return;e.preventDefault();toggle()}
 else if(tag!=='INPUT'&&(e.key==='ArrowRight'||e.key==='.'||e.key==='>')){e.preventDefault();step(1)}
 else if(tag!=='INPUT'&&(e.key==='ArrowLeft'||e.key===','||e.key==='<')){e.preventDefault();step(-1)}
});
const sh=$('.sheet'),ex=$('#extra');let col=false,H=0,dg=null;
function natural(){const p=ex.style.height,t=ex.style.transition;ex.style.transition='none';ex.style.height='auto';const h=ex.offsetHeight;ex.style.height=p;ex.style.transition=t;return h}
function snap(c){
 const h0=ex.offsetHeight;H=natural();
 ex.style.transition='none';ex.style.height=h0+'px';void ex.offsetHeight;
 ex.style.transition='height .28s ease,opacity .28s ease';
 col=c;sh.classList.toggle('col',c);
 ex.style.height=(c?0:H)+'px';ex.style.opacity=c?0:1;
 clearTimeout(snap.t);if(!c)snap.t=setTimeout(()=>{ex.style.height='auto'},300);
}
sh.addEventListener('pointerdown',e=>{if(!e.target.closest('.handle,.extra')||e.target.closest('.wave,button'))return;H=natural();dg={y:e.clientY,h:ex.offsetHeight,moved:false,handle:!!e.target.closest('.handle')};sh.setPointerCapture(e.pointerId);ex.style.transition='none'});
sh.addEventListener('pointermove',e=>{if(!dg)return;const dy=e.clientY-dg.y;if(Math.abs(dy)>4)dg.moved=true;const h=Math.max(0,Math.min(H,dg.h-dy));ex.style.height=h+'px';ex.style.opacity=H?h/H:1});
const endDrag=e=>{if(!dg)return;const dy=e.clientY-dg.y,d=dg;dg=null;if(!d.moved){snap(d.handle?!col:col);return}snap(Math.abs(dy)>30?dy>0:col)};
sh.addEventListener('pointerup',endDrag);sh.addEventListener('pointercancel',endDrag);
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{$('#stage').dataset.view=b.dataset.go});
(async()=>{tracks=await loadAll();tracks.sort((a,b)=>(a.added||a.id)-(b.added||b.id));render();drawPlayer();drawCtl()})();
})();
</script>
